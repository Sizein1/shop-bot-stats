<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bot · Statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thème « boutique Roblox » : un seul thème sombre, comme les menus du jeu */
  :root {
    color-scheme: dark;
    --panel: #17122b; --panel-2: #231b3d; --row: #2b2249; --line: #3b3160;
    --ink: #ffffff; --ink-2: #d6d0f0; --muted: #a59fc4;
    --green-dk: #23921f; --red-dk: #9c1f1b; --gray-dk: #8d8d8d;
    --money: #5dff4f; --bar: #47d64a;
    --eggs: #3987e5; --seed: #d95926;
    --rainbow: linear-gradient(90deg, #ff3b3b, #ff9a1f, #ffe11f, #45e04a, #1fd1ff, #4b6bff, #c64bff, #ff3b3b);
    --stroke: 0 3px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
    --stroke-sm: 0 2px 0 #000, 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 500 15px/1.45 "Fredoka", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.14), transparent 40%),
      repeating-conic-gradient(rgba(255,255,255,.035) 0 25%, transparent 0 50%) 0 0 / 48px 48px,
      linear-gradient(160deg, #3b5bff 0%, #7a3cff 45%, #c23aa8 100%);
    background-attachment: fixed;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .stroke { color: #fff; text-shadow: var(--stroke); }

  /* bandeau vert façon « Egg Shop » */
  .banner {
    position: relative; border: 4px solid #000; border-radius: 16px; padding: 14px 22px;
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 14px, transparent 14px 28px), linear-gradient(#6ae36a, #3cc23c);
    box-shadow: 0 6px 0 #000;
  }
  .banner h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .5px; line-height: 1.1; padding-right: 150px; }
  .banner .sub { margin: 4px 0 0; font-size: 14px; font-weight: 600; text-shadow: var(--stroke-sm); padding-right: 150px; }
  .status { position: absolute; top: 50%; right: 18px; transform: translateY(-50%); text-align: right; }
  .status .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 8px; border: 3px solid #000; border-radius: 10px;
                  font-weight: 700; font-size: 18px; color: #fff; text-shadow: var(--stroke-sm); }
  .status .on { background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }
  .status .off { background: linear-gradient(#f2625d, #d0302b); box-shadow: inset 0 -4px 0 var(--red-dk); }
  .status .led { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; background: #fff; }
  .status .on .led { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .status .on .led { animation: none; } }
  .status .since { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-shadow: var(--stroke-sm); }

  /* cadre arc-en-ciel autour du contenu, comme la fenêtre de la boutique */
  .frame { margin-top: 18px; padding: 5px; border-radius: 20px; background: var(--rainbow); box-shadow: 0 6px 0 #000; }
  .frame > .inner { background: var(--panel); border: 3px solid #000; border-radius: 16px; padding: 18px; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    font: 700 15px "Fredoka", "Segoe UI", sans-serif; color: #fff; text-shadow: var(--stroke-sm); cursor: pointer;
    padding: 6px 14px 8px; border: 3px solid #000; border-radius: 10px;
    background: linear-gradient(#e6e6e6, #a9a9a9); box-shadow: inset 0 -4px 0 var(--gray-dk);
  }
  .seg button:hover { filter: brightness(1.08); }
  .seg button:active { transform: translateY(2px); }
  .seg button[aria-pressed="true"] { background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }

  h2 { margin: 6px 0 4px; font-size: 24px; font-weight: 700; color: #fff; text-shadow: var(--stroke); }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .box { background: var(--panel-2); border: 3px solid #000; border-radius: 14px; padding: 12px 16px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }

  /* chiffres clés */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile .label { font-size: 14px; font-weight: 700; text-shadow: var(--stroke-sm); }
  .tile .value { font-size: 30px; font-weight: 700; color: var(--money); text-shadow: var(--stroke); margin-top: 2px; line-height: 1.15;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .note { color: var(--ink-2); font-size: 13px; }

  /* une carte par article */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .item .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .item .name { font-size: 18px; font-weight: 700; text-shadow: var(--stroke-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .big { font-size: 34px; font-weight: 700; color: var(--money); text-shadow: var(--stroke); line-height: 1.1; }
  .item .big small { font-size: 16px; color: #fff; }
  .item dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 14px; }
  .item dt { color: var(--muted); }
  .item dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { height: 14px; background: var(--row); border: 2px solid #000; border-radius: 7px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .item.never { opacity: .7; }
  .tag { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border: 2px solid currentColor; border-radius: 6px; background: rgba(0,0,0,.35); }
  .r1 { color: #6dff6a; } .r2 { color: #6fc3ff; } .r3 { color: #d59bff; } .r4 { color: #ffd34d; } .r0 { color: #ff4b45; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; vertical-align: -1px; margin-right: 6px; }

  /* graphiques en barres */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; border-bottom: 2px solid var(--line); }
  .bars .b { flex: 1; height: 100%; display: flex; align-items: flex-end; position: relative; }
  .bars .b i { display: block; width: 100%; min-height: 2px; background: var(--bar); border: 2px solid #000; border-bottom: 0; border-radius: 4px 4px 0 0; }
  .bars .b.off i { background: repeating-linear-gradient(45deg, var(--panel) 0 3px, var(--line) 3px 6px); border-color: var(--line); height: 100% !important; opacity: .45; }
  .bars .b:hover i { filter: brightness(1.2); }
  .axis { display: flex; gap: 3px; margin-top: 4px; }
  .axis span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: visible; }

  .recent { list-style: none; margin: 0; padding: 0; columns: 2 300px; column-gap: 12px; }
  .recent li { padding: 6px 10px; margin-bottom: 6px; break-inside: avoid; background: var(--row); border: 2px solid #000; border-radius: 10px; font-weight: 600; }
  .recent time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-weight: 500; }
  .empty { text-align: center; padding: 48px 16px; font-size: 18px; text-shadow: var(--stroke-sm); }
  #tip { position: fixed; pointer-events: none; background: var(--panel); color: #fff; border: 3px solid #000; box-shadow: 0 4px 0 #000;
         border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; display: none; z-index: 10; white-space: nowrap; }
  /* page admin */
  .admin-open { margin-left: auto; }
  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 0; border: 0; border-radius: 20px;
           background: var(--rainbow); padding: 5px; box-shadow: 0 6px 0 #000; color: var(--ink); }
  dialog::backdrop { background: rgba(10, 6, 30, .7); }
  #adminBody { background: var(--panel); border: 3px solid #000; border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
  #adminBody h2 { margin: 0; }
  #adminBody label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
  #adminBody input[type=password], #adminBody input[type=datetime-local] {
    font: 600 15px "Fredoka", "Segoe UI", sans-serif; color: #fff; background: var(--row); border: 3px solid #000; border-radius: 10px; padding: 8px 10px; }
  #adminBody .check { display: flex; align-items: center; gap: 8px; }
  .pick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .pick button, .act button {
    font: 700 14px "Fredoka", "Segoe UI", sans-serif; color: #fff; text-shadow: var(--stroke-sm); cursor: pointer; text-align: left;
    padding: 7px 10px 9px; border: 3px solid #000; border-radius: 10px; background: var(--row); box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
  .pick button[aria-pressed="true"] { background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }
  .act { display: flex; flex-wrap: wrap; gap: 8px; }
  .act button { text-align: center; background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }
  .act button.gray { background: linear-gradient(#e6e6e6, #a9a9a9); box-shadow: inset 0 -4px 0 var(--gray-dk); }
  .act button.red { background: linear-gradient(#f2625d, #d0302b); box-shadow: inset 0 -4px 0 var(--red-dk); }
  .act button:disabled { opacity: .5; cursor: wait; }
  .msg { font-size: 14px; font-weight: 600; min-height: 1.4em; }
  .msg .ok { color: var(--money); } .msg .err { color: #ff6b66; }
  .manual-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .manual-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 10px;
                    background: var(--row); border: 2px solid #000; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .manual-list li button { font: 700 12px "Fredoka", sans-serif; color: #fff; cursor: pointer; padding: 3px 8px; border: 2px solid #000; border-radius: 8px;
                           background: linear-gradient(#f2625d, #d0302b); }
  details summary { cursor: pointer; font-weight: 700; }
  details ol { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
  @media (max-width: 600px) {
    .banner h1 { font-size: 26px; padding-right: 0; } .banner .sub { padding-right: 0; }
    .admin-open { margin-left: 0; }
    .status { position: static; transform: none; text-align: left; margin-top: 10px; }
  }
</style>
</head>
<body>
<main>
  <header class="banner">
    <h1 class="stroke">📊 Stats Shop</h1>
    <p class="sub" id="sub"></p>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <div class="frame"><div class="inner">
    <div class="filters">
      <div class="seg" id="shopSeg" role="group" aria-label="Boutique">
        <button data-v="all" aria-pressed="true">Tout</button>
        <button data-v="eggs" aria-pressed="false">🥚 Œufs</button>
        <button data-v="seed" aria-pressed="false">🌱 Graines</button>
      </div>
      <div class="seg" id="periodSeg" role="group" aria-label="Période">
        <button data-v="1" aria-pressed="false">24 h</button>
        <button data-v="7" aria-pressed="false">7 jours</button>
        <button data-v="0" aria-pressed="true">Depuis le début</button>
      </div>
      <div class="seg admin-open"><button id="adminBtn" aria-haspopup="dialog">🔒 Admin</button></div>
    </div>
    <div id="content"></div>
  </div></div>
</main>
<div id="tip"></div>
<dialog id="admin" aria-labelledby="adminTitle"><div id="adminBody"></div></dialog>

<script src="historique.js"></script>
<script src="manuel.js"></script>
<script>
const HOUR = 3600e3, DAY = 24 * HOUR;
// durée d'un restock de chaque boutique (œufs 6 min 30, graines 5 min) : sert au calcul de la chance par restock
const RESTOCK_MIN = { eggs: 6.5, seed: 5 };
// le bot envoie un signal toutes les 10 min quand il tourne ; sans nouvelles depuis 25 min (PC éteint, plantage), il est « inactif »
const ACTIVE_MAX = 25 * 60e3;
// statut en direct via ntfy.sh (GitHub Pages met 1-2 min à publier) ; même canal que STATUS_URL dans shop_bot.py
const STATUS_URL = "https://ntfy.sh/shopbot-sizein1-42dad0def695";
const EMOJI = { eggs: "🥚", seed: "🌱" };
const state = { shop: "all", days: 0 };
let NOW, GEN, SEEN, ACTIVE, ITEMS, EVENTS, SESSIONS;
let LIVE = null;      // dernier statut reçu en direct : { actif, time }
const LIVE_STOCK = []; // apparitions reçues en direct, pas encore dans les données GitHub : [date, "stock"|"manuel", boutique, article]
const REMOVED = new Set(); // ajouts manuels supprimés depuis la page admin (encore présents quelques minutes ailleurs)
const key = r => r.join("|");

function load() {
  NOW = new Date();
  GEN = window.GENERATED ? new Date(window.GENERATED) : NOW;  // dernier envoi de données par le bot
  const live = LIVE && LIVE.time > GEN ? LIVE : null;           // le statut en direct l'emporte s'il est plus récent
  SEEN = live ? live.time : GEN;
  ACTIVE = (live ? live.actif : !!(window.BOT && window.BOT.actif)) && NOW - SEEN < ACTIVE_MAX;
  ITEMS = window.ITEMS || [];
  const hist = [...(window.HISTORY || []), ...(window.MANUAL || [])], known = new Set(hist.map(key));
  EVENTS = [...hist, ...LIVE_STOCK.filter(r => !known.has(key(r)))]  // sans doublon une fois arrivées sur GitHub
    .filter(r => !REMOVED.has(key(r)))
    .map(([t, e, shop, name]) => ({ t: new Date(t), e, shop, name })).sort((a, b) => a.t - b.t);
  // Sessions = périodes où le bot tournait (debut → fin). Une session sans « fin » se ferme à son dernier événement ;
  // la dernière va jusqu'à maintenant si le bot est actif, sinon jusqu'à son dernier signal.
  SESSIONS = [];
  let start = null, last = null;
  for (const x of EVENTS) {
    if (x.e === "debut") { if (start) SESSIONS.push([start, last]); start = last = x.t; }
    else if (x.e === "fin") { if (start) SESSIONS.push([start, x.t]); start = null; }
    else if (x.e === "stock") last = x.t;  // un ajout manuel ne prouve pas que le bot tournait
  }
  if (start) SESSIONS.push([start, ACTIVE ? NOW : SEEN]);
}

const fmtDur = ms => {
  const m = Math.round(ms / 60e3);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d} j ${h % 24} h`;
  return `${h} h${m % 60 ? " " + String(m % 60).padStart(2, "0") : ""}`;
};
const fmtDate = d => d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtAgo = d => NOW - d < 60e3 ? "à l'instant" : "il y a " + fmtDur(NOW - d);
const fmtPct = p => p >= 10 ? Math.round(p) + " %" : p >= 1 ? p.toFixed(1).replace(".", ",") + " %" : p > 0 ? "< 1 %" : "0 %";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const color = shop => `var(--${shop === "eggs" ? "eggs" : "seed"})`;
const overlap = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
// rareté d'après la chance d'apparaître à chaque restock
const rarity = p => p === 0 ? ["r0", "Jamais vu"] : p >= 30 ? ["r1", "Commun"] : p >= 10 ? ["r2", "Peu commun"] : p >= 3 ? ["r3", "Rare"] : ["r4", "Très rare"];

function bars(values, labels, tips, offs) {
  const max = Math.max(1, ...values);
  return `<div class="bars">${values.map((v, i) => `<div class="b${offs && offs[i] ? " off" : ""}" data-tip="${esc(tips[i])}">
      <i style="height:${(v / max * 100).toFixed(1)}%"></i></div>`).join("")}</div>
    <div class="axis">${labels.map(l => `<span>${l}</span>`).join("")}</div>`;
}

function render() {
  document.getElementById("status").innerHTML = ACTIVE
    ? `<span class="pill on"><i class="led"></i>ACTIF</span>`
    : `<span class="pill off"><i class="led"></i>INACTIF</span>${window.GENERATED || LIVE ? `<span class="since">vu ${fmtAgo(SEEN)}</span>` : ""}`;

  const first = EVENTS.length ? EVENTS[0].t : NOW;
  document.getElementById("sub").textContent = EVENTS.length
    ? `Depuis le ${fmtDate(first)} · mis à jour ${fmtAgo(GEN)}` : "Pas encore de données";
  const box = document.getElementById("content");
  if (!EVENTS.length) {
    box.innerHTML = `<div class="box empty">Aucune donnée pour l'instant.<br>Lance le bot : chaque œuf ou pack qui apparaît sera compté ici.</div>`;
    return;
  }

  const from = state.days ? new Date(NOW - state.days * DAY) : first;
  const inShop = s => state.shop === "all" || s === state.shop;
  const stock = EVENTS.filter(x => (x.e === "stock" || x.e === "manuel") && x.t >= from && inShop(x.shop));
  const botSeen = stock.filter(x => x.e === "stock");  // chances et moyennes : seulement ce que le bot a vu pendant qu'il surveillait
  const watched = SESSIONS.reduce((s, [a, b]) => s + overlap(a, b, from, NOW), 0);  // temps où le bot regardait

  // --- une carte par article ---
  const items = ITEMS.filter(i => inShop(i.shop)).map(it => {
    const hits = stock.filter(x => x.name === it.name), nBot = botSeen.filter(x => x.name === it.name).length;
    const restocks = watched / (RESTOCK_MIN[it.shop] * 60e3);
    const byHour = Array(24).fill(0); hits.forEach(x => byHour[x.t.getHours()]++);
    const bestH = byHour.indexOf(Math.max(...byHour));
    return { ...it, n: hits.length, nBot, last: hits.length ? hits[hits.length - 1].t : null,
             chance: restocks ? Math.min(100, nBot / restocks * 100) : 0, bestH };
  }).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const maxChance = Math.max(1, ...items.map(i => i.chance));
  const cards = items.map(r => {
    const [cls, label] = rarity(r.chance);
    return `<div class="box item${r.n ? "" : " never"}">
      <div class="top"><span class="name">${EMOJI[r.shop]} ${esc(r.name)}</span><span class="tag ${cls}">${label}</span></div>
      <div class="big">${r.n} <small>fois</small></div>
      <div class="meter" title="Chance à chaque restock"><i style="width:${(r.chance / maxChance * 100).toFixed(1)}%"></i></div>
      <dl>
        <dt>Chance par restock</dt><dd>${fmtPct(r.chance)}</dd>
        <dt>En moyenne</dt><dd>${r.nBot ? "toutes les " + fmtDur(watched / r.nBot) : "—"}</dd>
        <dt>Dernière fois</dt><dd>${r.last ? fmtAgo(r.last) : "—"}</dd>
        <dt>Heure la plus fréquente</dt><dd>${r.n ? `${r.bestH}h – ${r.bestH + 1}h` : "—"}</dd>
      </dl></div>`;
  }).join("");

  // --- chiffres clés ---
  const top = items[0], lastHit = stock[stock.length - 1];
  const tiles = `<div class="tiles">
      <div class="box tile"><div class="label">Apparitions</div><div class="value">${stock.length}</div>
        <div class="note">${botSeen.length ? "1 toutes les " + fmtDur(watched / botSeen.length) + " en moyenne" : stock.length ? "" : "aucune sur la période"}</div></div>
      <div class="box tile"><div class="label">Temps surveillé</div><div class="value">${fmtDur(watched)}</div>
        <div class="note">le bot ne voit rien quand il est arrêté</div></div>
      <div class="box tile"><div class="label">Le plus fréquent</div><div class="value">${top && top.n ? esc(top.name) : "—"}</div>
        <div class="note">${top && top.n ? top.n + " fois" : "—"}</div></div>
      <div class="box tile"><div class="label">Dernier apparu</div><div class="value">${lastHit ? esc(lastHit.name) : "—"}</div>
        <div class="note">${lastHit ? fmtAgo(lastHit.t) : "aucun sur la période"}</div></div>
    </div>`;

  // --- par heure de la journée ---
  const watchedH = Array(24).fill(0);
  for (const [a, b] of SESSIONS) {
    for (let t = new Date(Math.max(a, from)); t < b; ) {
      const next = new Date(t); next.setMinutes(60, 0, 0);
      watchedH[t.getHours()] += Math.min(next, b) - t;
      t = next;
    }
  }
  const perHour = Array(24).fill(0); stock.forEach(x => perHour[x.t.getHours()]++);
  const hourChart = bars(perHour, perHour.map((_, h) => h % 3 ? "" : h + "h"),
    perHour.map((v, h) => `${h}h – ${h + 1}h : ${v} apparition${v > 1 ? "s" : ""}` + (watchedH[h] ? ` (surveillé ${fmtDur(watchedH[h])})` : " · bot jamais actif à cette heure")),
    watchedH.map((w, h) => !w && !perHour[h]));

  // --- par jour (14 derniers jours max) ---
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const nDays = Math.min(14, Math.max(1, Math.round((day0(NOW) - day0(from)) / DAY) + 1));
  const days = Array.from({ length: nDays }, (_, i) => new Date(day0(NOW) - (nDays - 1 - i) * DAY));
  const perDay = days.map(d => stock.filter(x => day0(x.t).getTime() === d.getTime()).length);
  const dayLbl = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "numeric" });
  const dayChart = bars(perDay, days.map((d, i) => nDays > 7 && i % 2 ? "" : dayLbl(d)),
    perDay.map((v, i) => `${days[i].toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })} : ${v} apparition${v > 1 ? "s" : ""}`));

  const charts = `<div class="charts">
      <div class="box"><h2>À quelle heure ?</h2><p class="hint">Apparitions selon l'heure. Hachuré = le bot ne tournait pas à cette heure-là.</p>${hourChart}</div>
      <div class="box"><h2>Quel jour ?</h2><p class="hint">Apparitions par jour.</p>${dayChart}</div>
    </div>`;

  const recent = `<h2>Dernières apparitions</h2>
    <div class="box">${stock.length ? `<ul class="recent">${stock.slice(-20).reverse().map(x =>
      `<li><time>${fmtDate(x.t)}</time>${EMOJI[x.shop]} ${esc(x.name)}${x.e === "manuel" ? ' <span title="ajouté à la main">✋</span>' : ""}</li>`).join("")}</ul>`
      : `<p class="hint">Aucune apparition sur la période.</p>`}</div>`;

  box.innerHTML = tiles +
    `<h2>Chaque article</h2><p class="hint">« Chance par restock » : sur 100 restocks, combien de fois l'article était dans la boutique.
       Les ajouts à la main (✋) comptent dans « fois », mais pas dans la chance ni la moyenne : le bot ne surveillait pas.</p>
     <div class="cards">${cards}</div>` + charts + recent;
}

for (const [id, key, parse] of [["shopSeg", "shop", v => v], ["periodSeg", "days", Number]]) {
  const seg = document.getElementById(id);
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state[key] = parse(b.dataset.v);
    render();
  });
}

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY + 16) + "px";
});

// recharge les données chaque minute (le paramètre ?t= évite la version en cache)
setInterval(() => {
  for (const file of ["historique.js", "manuel.js"]) {
    const s = document.createElement("script");
    s.src = file + "?t=" + Date.now();
    s.onload = () => { s.remove(); load(); render(); };
    s.onerror = () => s.remove();
    document.body.appendChild(s);
  }
}, 60e3);

// direct : messages des 12 dernières heures (durée gardée par ntfy.sh), puis écoute continue (quelques secondes de délai)
function onStatus(m) {
  if (m.event !== "message") return;
  const p = m.message.split(";");
  // « stock|manuel|suppr;boutique;article;date » : apparition vue par le bot, ajoutée ou supprimée depuis la page admin
  if (["stock", "manuel", "suppr"].includes(p[0]) && p.length === 4) {
    if (p[0] === "suppr") REMOVED.add(key([p[3], "manuel", p[1], p[2]]));
    else {
      const row = [p[3], p[0], p[1], p[2]];
      REMOVED.delete(key(row));
      if (!LIVE_STOCK.some(r => key(r) === key(row))) LIVE_STOCK.push(row);
    }
    load(); render();
    return;
  }
  if (!/^(in)?actif$/.test(m.message)) return;
  const time = new Date(m.time * 1000);
  if (LIVE && LIVE.time > time) return;
  LIVE = { actif: m.message === "actif", time };
  load(); render();
}
fetch(STATUS_URL + "/json?poll=1&since=12h", { cache: "no-store" })
  .then(r => r.text())
  .then(t => t.split("\n").filter(Boolean).forEach(l => onStatus(JSON.parse(l))))
  .catch(() => {})
  .finally(() => {
    const es = new EventSource(STATUS_URL + "/sse");  // se reconnecte tout seul si la connexion coupe
    es.onmessage = e => onStatus(JSON.parse(e.data));
  });
setInterval(() => { load(); render(); }, 30e3);  // passe à « inactif » sans recharger si le bot ne donne plus signe de vie

// ---------- Page admin : ajouter à la main une apparition vue quand le bot était arrêté ----------
// L'accès repose sur une clé GitHub que seul le propriétaire possède : sans elle, impossible d'écrire dans le dépôt.
// La clé et l'URL du webhook Discord restent dans CE navigateur (localStorage), jamais dans le site publié.
const REPO = "Sizein1/shop-bot-stats";
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
const localISO = d => new Date(d - d.getTimezoneOffset() * 60e3).toISOString().slice(0, 19);
const b64enc = s => btoa(Array.from(new TextEncoder().encode(s), c => String.fromCharCode(c)).join(""));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, { cache: "no-store", ...opts,
    headers: { Authorization: "Bearer " + store.get("gh_token"), Accept: "application/vnd.github+json" } });
  if (!r.ok) throw Object.assign(new Error(r.status === 401 ? "clé GitHub refusée ou expirée"
    : r.status === 403 || r.status === 404 ? "cette clé n'a pas le droit de modifier shop-bot-stats" : `GitHub a répondu ${r.status}`), { status: r.status });
  return r.json();
}

// relit manuel.js sur GitHub, applique le changement et le réenregistre
async function editManual(change) {
  for (let attempt = 0; ; attempt++) {
    const f = await gh("/contents/manuel.js");
    const text = b64dec(f.content);
    const rows = JSON.parse(text.slice(text.indexOf("["), text.lastIndexOf("]") + 1));
    change(rows);
    try {
      await gh("/contents/manuel.js", { method: "PUT", body: JSON.stringify({ message: "Page admin : ajouts manuels",
        content: b64enc("window.MANUAL = " + JSON.stringify(rows) + ";\n"), sha: f.sha }) });
      window.MANUAL = rows;
      return;
    } catch (e) { if (![409, 422].includes(e.status) || attempt) throw e; }  // le bot a envoyé au même moment : on relit et on recommence
  }
}

const dlg = document.getElementById("admin"), adminBody = document.getElementById("adminBody");
let pick = null;
const setMsg = (html) => { const m = document.getElementById("adminMsg"); if (m) m.innerHTML = html; };
document.getElementById("adminBtn").onclick = () => { drawAdmin(); dlg.showModal(); };
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });  // clic à côté de la fenêtre = fermer

function drawLogin(msg = "") {
  adminBody.innerHTML = `
    <h2 id="adminTitle">🔒 Admin</h2>
    <p class="hint" style="margin:0">Réservé au propriétaire : il faut ta clé GitHub. Elle reste dans ce navigateur et n'est jamais publiée.</p>
    <label>Clé GitHub<input type="password" id="tokIn" autocomplete="off" placeholder="github_pat_…"></label>
    <label>Webhook Discord (pour les notifs)<input type="password" id="hookIn" autocomplete="off" placeholder="https://discord.com/api/webhooks/…"></label>
    <div class="act"><button id="loginBtn">Se connecter</button><button class="gray" id="closeBtn">Fermer</button></div>
    <div class="msg" id="adminMsg" role="status">${msg}</div>
    <details><summary>Comment créer ma clé GitHub ?</summary><ol>
      <li>Sur github.com : ta photo de profil → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
      <li>Nom : « Stats Shop admin », expiration au choix.</li>
      <li><b>Repository access</b> : <i>Only select repositories</i> → <b>shop-bot-stats</b>.</li>
      <li><b>Permissions</b> → <b>Contents</b> : <i>Read and write</i>. Rien d'autre.</li>
      <li><b>Generate token</b>, copie la clé et colle-la ici.</li></ol></details>`;
}

function drawAdmin(msg = "") {
  if (!store.get("gh_token")) return drawLogin(msg);
  const hook = store.get("discord_url");
  const mine = (window.MANUAL || []).filter(r => !REMOVED.has(key(r))).slice(-8).reverse();
  adminBody.innerHTML = `
    <h2 id="adminTitle">🔓 Admin</h2>
    <div><b>1. Quel article est apparu ?</b>
      <div class="pick" style="margin-top:6px">${(window.ITEMS || []).map((it, i) =>
        `<button data-i="${i}" aria-pressed="${pick === i}">${EMOJI[it.shop]} ${esc(it.name)}</button>`).join("")}</div></div>
    <label>2. Quand ?<input type="datetime-local" id="when" step="1" value="${localISO(new Date())}"></label>
    <label class="check"><input type="checkbox" id="discordOn" ${hook ? "checked" : "disabled"}>
      Envoyer la notif Discord${hook ? "" : " (ajoute ton webhook dans Réglages)"}</label>
    <div class="act"><button id="addBtn">➕ Ajouter l'apparition</button><button class="gray" id="closeBtn">Fermer</button></div>
    <div class="msg" id="adminMsg" role="status">${msg}</div>
    ${mine.length ? `<div><b>Derniers ajouts à la main</b><ul class="manual-list" style="margin-top:6px">${mine.map(r =>
      `<li><span>${fmtDate(new Date(r[0]))} · ${EMOJI[r[2]]} ${esc(r[3])}</span><button data-del="${esc(key(r))}">Supprimer</button></li>`).join("")}</ul></div>` : ""}
    <details><summary>Réglages</summary>
      <label style="margin-top:8px">Webhook Discord<input type="password" id="hookIn" autocomplete="off" placeholder="https://discord.com/api/webhooks/…"></label>
      <div class="act" style="margin-top:8px"><button id="saveHook">Enregistrer le webhook</button><button class="red" id="logout">Se déconnecter</button></div>
    </details>`;
}

const validHook = u => /^https:\/\/(discord|discordapp)\.com\/api\/webhooks\/\d+\/[\w-]+$/.test(u);

adminBody.onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "closeBtn") return dlg.close();

  if (b.id === "loginBtn") {
    const tok = document.getElementById("tokIn").value.trim(), hook = document.getElementById("hookIn").value.trim();
    if (!tok) return setMsg('<span class="err">Colle ta clé GitHub.</span>');
    if (hook && !validHook(hook)) return setMsg('<span class="err">Ce webhook Discord n\'a pas le bon format.</span>');
    b.disabled = true; setMsg("Vérification…");
    store.set("gh_token", tok);
    try { await gh("/contents/manuel.js"); }
    catch (err) { store.set("gh_token", null); return drawLogin(`<span class="err">❌ ${esc(err.message)}</span>`); }
    if (hook) store.set("discord_url", hook);
    return drawAdmin('<span class="ok">✅ Connecté</span>');
  }

  if (b.dataset.i !== undefined) {
    pick = Number(b.dataset.i);
    adminBody.querySelectorAll(".pick button").forEach(x => x.setAttribute("aria-pressed", x === b));
    return;
  }

  if (b.id === "addBtn") {
    const it = (window.ITEMS || [])[pick];
    if (!it) return setMsg('<span class="err">Choisis d\'abord l\'article.</span>');
    const when = document.getElementById("when").value;
    if (!when) return setMsg('<span class="err">Indique l\'heure.</span>');
    const ts = when.length === 16 ? when + ":00" : when, row = [ts, "manuel", it.shop, it.name];
    const sendDiscord = document.getElementById("discordOn").checked;
    b.disabled = true; setMsg("Enregistrement…");
    try { await editManual(rows => rows.push(row)); }
    catch (err) { b.disabled = false; return setMsg(`<span class="err">❌ Pas enregistré : ${esc(err.message)}</span>`); }
    fetch(STATUS_URL, { method: "POST", body: `manuel;${it.shop};${it.name};${ts}` }).catch(() => {});  // visible tout de suite partout
    REMOVED.delete(key(row));
    if (!LIVE_STOCK.some(r => key(r) === key(row))) LIVE_STOCK.push(row);
    load(); render();
    let discordMsg = "";
    if (sendDiscord) {
      try {
        const r = await fetch(store.get("discord_url"), { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: `@everyone ${EMOJI[it.shop]} ${it.name} en stock !`, allowed_mentions: { parse: ["everyone"] } }) });
        discordMsg = r.ok ? " + notif Discord envoyée" : ` <span class="err">mais Discord a refusé la notif (${r.status})</span>`;
      } catch { discordMsg = ' <span class="err">mais la notif Discord n\'est pas partie</span>'; }
    }
    pick = null;
    return drawAdmin(`<span class="ok">✅ ${EMOJI[it.shop]} ${esc(it.name)} ajouté</span>${discordMsg}`);
  }

  if (b.dataset.del) {
    const k = b.dataset.del, [ts, , shop, name] = k.split("|");
    if (!confirm(`Supprimer ${name} du ${fmtDate(new Date(ts))} ?`)) return;
    b.disabled = true;
    try { await editManual(rows => { const i = rows.findIndex(r => key(r) === k); if (i >= 0) rows.splice(i, 1); }); }
    catch (err) { b.disabled = false; return setMsg(`<span class="err">❌ Pas supprimé : ${esc(err.message)}</span>`); }
    fetch(STATUS_URL, { method: "POST", body: `suppr;${shop};${name};${ts}` }).catch(() => {});
    REMOVED.add(k);
    load(); render();
    return drawAdmin('<span class="ok">✅ Supprimé</span>');
  }

  if (b.id === "saveHook") {
    const hook = document.getElementById("hookIn").value.trim();
    if (!validHook(hook)) return setMsg('<span class="err">Ce webhook Discord n\'a pas le bon format.</span>');
    store.set("discord_url", hook);
    return drawAdmin('<span class="ok">✅ Webhook enregistré</span>');
  }

  if (b.id === "logout") {
    store.set("gh_token", null); store.set("discord_url", null);
    return drawLogin('<span class="ok">Déconnecté : la clé et le webhook sont effacés de ce navigateur.</span>');
  }
};

load();
render();
</script>
</body>
</html>
