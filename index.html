<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bot · Statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thème « boutique Roblox » : un seul thème sombre, comme les menus du jeu */
  :root {
    color-scheme: dark;
    --panel: #17122b; --panel-2: #231b3d; --row: #2b2249; --line: #3b3160;
    --ink: #ffffff; --ink-2: #d6d0f0; --muted: #a59fc4;
    --green: #47d64a; --green-dk: #23921f; --red: #e8413c; --red-dk: #9c1f1b; --gray: #d4d4d4; --gray-dk: #8d8d8d;
    --money: #5dff4f;
    --eggs: #3987e5; --seed: #d95926;
    --heat-0: #2b2249; --heat-1: #104281; --heat-2: #1c5cab; --heat-3: #2a78d6; --heat-4: #5598e7; --heat-5: #9ec5f4;
    --band: rgba(71,214,74,0.10);
    --rainbow: linear-gradient(90deg, #ff3b3b, #ff9a1f, #ffe11f, #45e04a, #1fd1ff, #4b6bff, #c64bff, #ff3b3b);
    --stroke: 0 3px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
    --stroke-sm: 0 2px 0 #000, 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 500 15px/1.45 "Fredoka", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.14), transparent 40%),
      repeating-conic-gradient(rgba(255,255,255,.035) 0 25%, transparent 0 50%) 0 0 / 48px 48px,
      linear-gradient(160deg, #3b5bff 0%, #7a3cff 45%, #c23aa8 100%);
    background-attachment: fixed;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .stroke { color: #fff; text-shadow: var(--stroke); }

  /* bandeau vert façon « Egg Shop » */
  .banner {
    position: relative; border: 4px solid #000; border-radius: 16px; padding: 14px 22px;
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 14px, transparent 14px 28px), linear-gradient(#6ae36a, #3cc23c);
    box-shadow: 0 6px 0 #000;
  }
  .banner h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .5px; line-height: 1.1; padding-right: 150px; }
  .status { position: absolute; top: 50%; right: 18px; transform: translateY(-50%); text-align: right; }
  .status .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 8px; border: 3px solid #000; border-radius: 10px;
                  font-weight: 700; font-size: 18px; color: #fff; text-shadow: var(--stroke-sm); }
  .status .on { background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }
  .status .off { background: linear-gradient(#f2625d, #d0302b); box-shadow: inset 0 -4px 0 var(--red-dk); }
  .status .led { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; background: #fff; }
  .status .on .led { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .status .on .led { animation: none; } }
  .status .since { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-shadow: var(--stroke-sm); }
  .banner .sub { margin: 4px 0 0; font-size: 14px; font-weight: 600; text-shadow: var(--stroke-sm); }

  /* cadre arc-en-ciel autour du contenu, comme la fenêtre de la boutique */
  .frame { margin-top: 18px; padding: 5px; border-radius: 20px; background: var(--rainbow); box-shadow: 0 6px 0 #000; }
  .frame > .inner { background: var(--panel); border: 3px solid #000; border-radius: 16px; padding: 18px; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button {
    font: 700 15px "Fredoka", "Segoe UI", sans-serif; color: #fff; text-shadow: var(--stroke-sm); cursor: pointer;
    padding: 6px 14px 8px; border: 3px solid #000; border-radius: 10px;
    background: linear-gradient(#e6e6e6, #a9a9a9); box-shadow: inset 0 -4px 0 var(--gray-dk);
  }
  .seg button:hover { filter: brightness(1.08); }
  .seg button:active { transform: translateY(2px); }
  .seg button[aria-pressed="true"] { background: linear-gradient(#69e66b, #36bd38); box-shadow: inset 0 -4px 0 var(--green-dk); }
  .legend { display: flex; gap: 14px; margin-left: auto; font-weight: 600; text-shadow: var(--stroke-sm); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; vertical-align: -1px; margin-right: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--panel-2); border: 3px solid #000; border-radius: 14px; }
  .tile { padding: 12px 16px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
  .tile .label { font-size: 14px; font-weight: 700; text-shadow: var(--stroke-sm); }
  .tile .value { font-size: 32px; font-weight: 700; color: var(--money); text-shadow: var(--stroke); margin-top: 2px; line-height: 1.15; }
  .tile .note { color: var(--ink-2); font-size: 13px; }
  .card { padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: #fff; text-shadow: var(--stroke); }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 0 12px; }
  td { padding: 9px 12px; background: var(--row); border-top: 2px solid #000; border-bottom: 2px solid #000; font-weight: 600; }
  td:first-child { border-left: 2px solid #000; border-radius: 10px 0 0 10px; font-size: 16px; text-shadow: var(--stroke-sm); }
  td:last-child { border-right: 2px solid #000; border-radius: 0 10px 10px 0; }
  td.num, th.num { text-align: right; }
  .count { color: var(--money); font-size: 18px; text-shadow: var(--stroke-sm); }
  .zero td { opacity: .75; }
  .nostock { display: inline-block; background: #3a0d0d; color: #ff4b45; border: 2px solid #ff4b45; border-radius: 6px;
             padding: 0 8px; font-weight: 700; font-size: 13px; letter-spacing: .3px; }

  /* carte de chaleur */
  .heat { display: grid; grid-template-columns: 170px repeat(24, minmax(18px, 1fr)); gap: 3px; min-width: 660px; }
  .heat .rl, .tl-row .rl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; align-self: center; text-shadow: var(--stroke-sm); }
  .heat .hl { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .cell { height: 26px; border-radius: 5px; background: var(--heat-0); border: 2px solid #000; }
  .cell.off { background: repeating-linear-gradient(45deg, var(--panel) 0 3px, var(--line) 3px 6px); }
  .scale { display: flex; align-items: center; gap: 4px; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .scale span.sw { width: 20px; height: 14px; border-radius: 4px; border: 2px solid #000; }

  /* chronologie */
  .tl { min-width: 660px; }
  .tl-row { display: grid; grid-template-columns: 170px 1fr; align-items: center; height: 30px; }
  .track { position: relative; height: 100%; border-bottom: 2px dashed var(--line); }
  .band { position: absolute; top: 3px; bottom: 3px; background: var(--band); border-radius: 4px; }
  .mark { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; border: 2px solid #000; }
  .mark::after { content: ""; position: absolute; inset: -6px; } /* zone de survol plus grande que le point */
  .axis { position: relative; height: 24px; margin-left: 170px; }
  .axis span { position: absolute; top: 5px; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }

  .recent { list-style: none; margin: 0; padding: 0; columns: 2 300px; column-gap: 12px; }
  .recent li { padding: 6px 10px; margin-bottom: 6px; break-inside: avoid; background: var(--row); border: 2px solid #000; border-radius: 10px; font-weight: 600; }
  .recent time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-weight: 500; }
  .empty { text-align: center; padding: 48px 16px; font-size: 18px; text-shadow: var(--stroke-sm); }
  #tip { position: fixed; pointer-events: none; background: var(--panel); color: #fff; border: 3px solid #000; box-shadow: 0 4px 0 #000;
         border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; display: none; z-index: 10; white-space: nowrap; }
  @media (max-width: 600px) {
    .banner h1 { font-size: 26px; padding-right: 0; } .legend { margin-left: 0; }
    .status { position: static; transform: none; text-align: left; margin-top: 10px; }
  }
</style>
</head>
<body>
<main>
  <header class="banner">
    <h1 class="stroke">📊 Stats Shop</h1>
    <p class="sub" id="sub"></p>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <div class="frame"><div class="inner">
    <div class="filters">
      <div class="seg" id="shopSeg" role="group" aria-label="Boutique">
        <button data-v="all" aria-pressed="true">Tout</button>
        <button data-v="eggs" aria-pressed="false">🥚 Œufs</button>
        <button data-v="seed" aria-pressed="false">🌱 Graines</button>
      </div>
      <div class="seg" id="periodSeg" role="group" aria-label="Période">
        <button data-v="1" aria-pressed="false">24 h</button>
        <button data-v="7" aria-pressed="true">7 jours</button>
        <button data-v="30" aria-pressed="false">30 jours</button>
        <button data-v="0" aria-pressed="false">Tout</button>
      </div>
      <div class="legend"><span><i class="dot" style="background:var(--eggs)"></i>Œufs</span><span><i class="dot" style="background:var(--seed)"></i>Graines</span></div>
    </div>

    <div id="content"></div>
  </div></div>
</main>
<div id="tip"></div>

<script src="historique.js"></script>
<script>
const HOUR = 3600e3, DAY = 24 * HOUR;
// le bot envoie un signal toutes les 10 min quand il tourne ; sans nouvelles depuis 25 min (PC éteint, plantage), il est « inactif »
const ACTIVE_MAX = 25 * 60e3;
const state = { shop: "all", days: 7 };
let NOW, GEN, ACTIVE, ITEMS, EVENTS, SESSIONS;

function load() {
  NOW = new Date();
  GEN = window.GENERATED ? new Date(window.GENERATED) : NOW;  // dernier envoi de données par le bot
  ACTIVE = !!(window.BOT && window.BOT.actif) && NOW - GEN < ACTIVE_MAX;
  ITEMS = window.ITEMS || [];
  EVENTS = (window.HISTORY || []).map(([t, e, shop, name]) => ({ t: new Date(t), e, shop, name })).sort((a, b) => a.t - b.t);
  // Sessions = périodes où le bot tournait (debut → fin). Une session sans « fin » se ferme à son dernier événement ;
  // la dernière va jusqu'à maintenant si le bot est actif, sinon jusqu'à son dernier signal.
  SESSIONS = [];
  let start = null, last = null;
  for (const x of EVENTS) {
    if (x.e === "debut") { if (start) SESSIONS.push([start, last]); start = last = x.t; }
    else if (x.e === "fin") { if (start) SESSIONS.push([start, x.t]); start = null; }
    else last = x.t;
  }
  if (start) SESSIONS.push([start, ACTIVE ? NOW : GEN]);
}

const fmtDur = ms => {
  const m = Math.round(ms / 60e3);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d} j ${h % 24} h`;
  return `${h} h${m % 60 ? " " + String(m % 60).padStart(2, "0") : ""}`;
};
const fmtDate = d => d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtAgo = d => NOW - d < 60e3 ? "à l'instant" : "il y a " + fmtDur(NOW - d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const color = shop => `var(--${shop === "eggs" ? "eggs" : "seed"})`;

function overlap(a0, a1, b0, b1) { return Math.max(0, Math.min(a1, b1) - Math.max(a0, b0)); }

function render() {
  const first = EVENTS.length ? EVENTS[0].t : NOW;
  const from = state.days ? new Date(NOW - state.days * DAY) : first;
  const items = ITEMS.filter(i => state.shop === "all" || i.shop === state.shop);
  const stock = EVENTS.filter(x => x.e === "stock" && x.t >= from && (state.shop === "all" || x.shop === state.shop));
  const observed = SESSIONS.reduce((s, [a, b]) => s + overlap(a, b, from, NOW), 0);

  document.getElementById("status").innerHTML = ACTIVE
    ? `<span class="pill on"><i class="led"></i>ACTIF</span>`
    : `<span class="pill off"><i class="led"></i>INACTIF</span>${window.GENERATED ? `<span class="since">vu ${fmtAgo(GEN)}</span>` : ""}`;
  document.getElementById("sub").textContent = EVENTS.length
    ? `Données du bot depuis le ${fmtDate(first)} · mises à jour ${fmtAgo(GEN)}`
    : "Pas encore de données";
  const box = document.getElementById("content");
  if (!EVENTS.length) {
    box.innerHTML = `<div class="card empty">Aucune donnée pour l'instant.<br>Lance le bot : chaque apparition d'un œuf ou d'un pack sera enregistrée ici.</div>`;
    return;
  }

  // --- par article ---
  const rows = items.map(it => {
    const hits = stock.filter(x => x.name === it.name);
    return { ...it, n: hits.length, last: hits.length ? hits[hits.length - 1].t : null };
  }).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const lastHit = stock[stock.length - 1];
  const obsH = observed / HOUR;

  const tiles = `
    <div class="tiles">
      <div class="tile"><div class="label">Apparitions</div><div class="value">${stock.length}</div>
        <div class="note">${rows.filter(r => r.n).length} article(s) différent(s)</div></div>
      <div class="tile"><div class="label">Temps observé</div><div class="value">${fmtDur(observed)}</div>
        <div class="note">bot en marche sur la période</div></div>
      <div class="tile"><div class="label">Fréquence globale</div><div class="value">${stock.length && obsH ? fmtDur(observed / stock.length) : "—"}</div>
        <div class="note">une apparition toutes les… (temps observé)</div></div>
      <div class="tile"><div class="label">Dernière apparition</div><div class="value" style="font-size:22px">${lastHit ? esc(lastHit.name) : "—"}</div>
        <div class="note">${lastHit ? fmtAgo(lastHit.t) : "aucune sur la période"}</div></div>
    </div>`;

  const table = `
    <div class="card"><h2>Par article</h2>
      <p class="hint">« Fréquence » = temps observé ÷ nombre d'apparitions : les heures où le bot était arrêté ne comptent pas.</p>
      <table><thead><tr><th>Article</th><th class="num">Apparitions</th><th class="num">Par 24 h observées</th>
        <th class="num">Fréquence</th><th class="num">Dernière fois</th></tr></thead><tbody>
      ${rows.map(r => `<tr${r.n ? "" : ' class="zero"'}><td><i class="dot" style="background:${color(r.shop)}"></i>${esc(r.name)}</td>
        <td class="num"><span class="count">${r.n}</span></td><td class="num">${obsH ? (r.n / obsH * 24).toFixed(1) : "—"}</td>
        <td class="num">${r.n ? "toutes les " + fmtDur(observed / r.n) : '<span class="nostock">NO STOCK</span>'}</td>
        <td class="num">${r.last ? fmtAgo(r.last) : "—"}</td></tr>`).join("")}
      </tbody></table></div>`;

  // --- carte de chaleur : heure de la journée ---
  const covered = Array(24).fill(0); // minutes observées par heure de la journée
  for (const [a, b] of SESSIONS) {
    for (let t = new Date(Math.max(a, from)); t < b; ) {
      const next = new Date(t); next.setMinutes(60, 0, 0);
      covered[t.getHours()] += (Math.min(next, b) - t) / 60e3;
      t = next;
    }
  }
  const counts = rows.map(r => { const c = Array(24).fill(0); stock.filter(x => x.name === r.name).forEach(x => c[x.t.getHours()]++); return c; });
  const max = Math.max(1, ...counts.flat());
  const level = v => v ? Math.min(5, Math.ceil(v / max * 5)) : 0;
  const heat = `
    <div class="card"><h2>Heure de la journée</h2>
      <p class="hint">Nombre d'apparitions par heure. Les cases hachurées sont des heures où le bot n'a jamais tourné sur la période.</p>
      <div class="heat">
        <div></div>${Array.from({ length: 24 }, (_, h) => `<div class="hl">${h % 3 ? "" : h + "h"}</div>`).join("")}
        ${rows.map((r, i) => `<div class="rl" title="${esc(r.name)}"><i class="dot" style="background:${color(r.shop)}"></i>${esc(r.name)}</div>` +
          counts[i].map((v, h) => {
            const off = !covered[h];
            return `<div class="cell${off ? " off" : ""}" style="${off ? "" : `background:var(--heat-${level(v)})`}"
              data-tip="${esc(r.name)} · ${h}h–${h + 1}h : ${off ? "non observé" : `${v} apparition${v > 1 ? "s" : ""} (${fmtDur(covered[h] * 60e3)} observées)`}"></div>`;
          }).join("")).join("")}
      </div>
      <div class="scale">moins ${[1, 2, 3, 4, 5].map(l => `<span class="sw" style="background:var(--heat-${l})"></span>`).join("")} plus</div>
    </div>`;

  // --- frise chronologique ---
  const span = NOW - from || 1, pos = t => ((t - from) / span * 100).toFixed(3) + "%";
  const bands = SESSIONS.filter(([a, b]) => b > from).map(([a, b]) => {
    const a2 = Math.max(a, from);
    return `<div class="band" style="left:${pos(a2)};width:${((b - a2) / span * 100).toFixed(3)}%"></div>`;
  }).join("");
  const ticks = Array.from({ length: 6 }, (_, i) => new Date(+from + span * i / 5));
  const tickFmt = d => state.days === 1 ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
                                        : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  const timeline = `
    <div class="card"><h2>Chronologie</h2>
      <p class="hint">Chaque point est une apparition ; la bande verte montre quand le bot tournait.</p>
      <div class="tl">
        ${rows.map(r => `<div class="tl-row"><div class="rl" title="${esc(r.name)}">${esc(r.name)}</div><div class="track">${bands}
          ${stock.filter(x => x.name === r.name).map(x => `<div class="mark" style="left:${pos(x.t)};background:${color(r.shop)}"
            data-tip="${esc(r.name)} · ${fmtDate(x.t)}"></div>`).join("")}</div></div>`).join("")}
        <div class="axis">${ticks.map((d, i) => `<span style="left:${i * 20}%;${i === 0 ? "transform:none" : i === 5 ? "transform:translateX(-100%)" : ""}">${tickFmt(d)}</span>`).join("")}</div>
      </div>
    </div>`;

  const recent = `
    <div class="card"><h2>Dernières apparitions</h2>
      ${stock.length ? `<ul class="recent">${stock.slice(-30).reverse().map(x =>
        `<li><time>${fmtDate(x.t)}</time><i class="dot" style="background:${color(x.shop)}"></i>${esc(x.name)}</li>`).join("")}</ul>`
        : `<p class="hint">Aucune apparition sur la période.</p>`}
    </div>`;

  box.innerHTML = tiles + table + heat + timeline + recent;
}

for (const [id, key, parse] of [["shopSeg", "shop", v => v], ["periodSeg", "days", Number]]) {
  const seg = document.getElementById(id);
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state[key] = parse(b.dataset.v);
    render();
  });
}

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px";
  tip.style.top = (e.clientY + 16) + "px";
});

// recharge les données chaque minute (le paramètre ?t= évite la version en cache)
setInterval(() => {
  const s = document.createElement("script");
  s.src = "historique.js?t=" + Date.now();
  s.onload = () => { s.remove(); load(); render(); };
  s.onerror = () => s.remove();
  document.body.appendChild(s);
}, 60e3);

load();
render();
</script>
</body>
</html>
